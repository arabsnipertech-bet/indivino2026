<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b1018">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Accedi | I Divini Digitali</title>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-brand">
      <a href="/" class="back-link">← Torna alla home</a>
      <div class="auth-logos">
        <img src="images/logo-proloco-solofra.png" alt="Pro Loco Solofra">
        <img src="images/logo-indivino-2026.png" alt="Indivino 2026">
      </div>
      <span class="eyebrow">Area riservata</span>
      <h1>Accedi al tuo portafoglio</h1>
      <p>La destinazione verrà scelta automaticamente in base al tuo ruolo.</p>
    </section>

    <section class="auth-card">
      <form id="login-form" novalidate>
        <div class="form-heading">
          <h2>Accesso</h2>
          <p>Inserisci le credenziali utilizzate in fase di registrazione.</p>
        </div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@email.it" required>

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="La tua password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="password">Mostra</button>
        </div>

        <div id="form-message" class="form-message" aria-live="polite"></div>

        <button class="button button--primary button--full" type="submit">Accedi</button>

        <p class="auth-switch">Non hai ancora un account? <a href="/registrazione">Registrati</a></p>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
