<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b1018">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Registrazione | I Divini Digitali</title>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-brand">
      <a href="index.html" class="back-link">← Torna alla home</a>
      <div class="auth-logos">
        <img src="images/logo-proloco-solofra.png" alt="Pro Loco Solofra">
        <img src="images/logo-indivino-2026.png" alt="Indivino 2026">
      </div>
      <span class="eyebrow">Nuovo portafoglio</span>
      <h1>Registrati a Indivino</h1>
      <p>Dopo la registrazione riceverai il tuo QR personale.</p>
    </section>

    <section class="auth-card">
      <form id="registration-form" novalidate>
        <div class="form-heading">
          <h2>Crea account</h2>
          <p>I campi contrassegnati sono obbligatori.</p>
        </div>

        <div class="form-row">
          <div>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" autocomplete="given-name" required>
          </div>
          <div>
            <label for="cognome">Cognome</label>
            <input id="cognome" name="cognome" type="text" autocomplete="family-name" required>
          </div>
        </div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@email.it" required>

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="password">Mostra</button>
        </div>
        <p class="field-help">Almeno 8 caratteri.</p>

        <label class="check-row">
          <input type="checkbox" id="privacy" required>
          <span>Ho letto e accetto l’informativa privacy del servizio.</span>
        </label>

        <div id="form-message" class="form-message" aria-live="polite"></div>

        <button class="button button--primary button--full" type="submit">Crea il portafoglio</button>

        <p class="auth-switch">Hai già un account? <a href="login.html">Accedi</a></p>
      </form>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
